[project]
name = "triage"
version = "0.1.0"
description = "Blameless CI Triage certification slice — toolchain bootstrap (Story 0.1)"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[http-server]==1.1.5",
    "typesafe-sdk==0.7.1",
    "anthropic==1.8.0",
    "pydantic==2.13.5",
    "psycopg==3.3.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "C90", "PL", "ARG", "RUF", "ERA"]
mccabe.max-complexity = 10
pylint.max-args = 5

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["contracts", "guardrails", "workflow"]

[tool.coverage.report]
fail_under = 85
