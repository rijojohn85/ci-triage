# Blameless CI Triage — local service foundation (story 0.3).
# Runtime/AD-25: Compose for dev + graded E2E, same images on k8s later.
# Secret placement per AD-16; names only here via interpolation, values in
# .env (never committed; see .env.example). No a2a-db / DatabaseTaskStore
# schema: the A2A task projection comes with story 2.4 using its own tables.
#
# Run from the repo root:
#   docker compose -f deploy/compose.yaml up -d --wait
#   docker compose -f deploy/compose.yaml run --rm migrate   # re-check migrations

name: triage

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    # postgres:18 keeps its data under /var/lib/postgresql/<major>/docker and
    # declares the volume at /var/lib/postgresql (image 18+ PGDATA change).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-triage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing (copy .env.example to .env and fill names)}
      POSTGRES_DB: ${POSTGRES_DB:-triage}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  migrate:
    # One-shot forward-only migration job (AD-25). Exits 0 when everything in
    # deploy/migrations/ is tracked; non-zero aborts dependents below.
    build:
      context: .
      dockerfile: deploy/migrate.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Compose builds the in-network DSN from the same .env names as the
      # host-side DATABASE_URL; values never appear literally in this file.
      DATABASE_URL: postgresql://${POSTGRES_USER:-triage}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-triage}
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./deploy/migrations:/migrations:ro
    restart: "no"

  # --- Service placeholders (real images follow with their stories) --------
  # Each lists exactly the secret names AD-16 allows it; the placement test
  # (tests/security/test_compose_secret_placement.py) owns the scope table.

  gateway:
    # Real intake service (story 1.1, AD-17): verifies the webhook signature,
    # dedupes deliveries and inserts triage_run(RECEIVED). Builds from the
    # shared repo image; secret names are unchanged from the placeholder.
    build:
      context: .
      dockerfile: deploy/gateway.Dockerfile
    command: ["python", "-m", "gateway"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-triage}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-triage}
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"

  orchestrator:
    image: busybox:1.37.0
    command: ["sleep", "infinity"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-https://openrouter.ai/api}
      DATABASE_URL: postgresql://${POSTGRES_USER:-triage}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-triage}

  # Spoke agents (A2A servers): model-API key only, no Postgres (AD-5/AD-16).

  jev:
    image: busybox:1.37.0
    command: ["sleep", "infinity"]
    environment:
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-https://openrouter.ai/api}

  analyzer:
    image: busybox:1.37.0
    command: ["sleep", "infinity"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  proposer:
    image: busybox:1.37.0
    command: ["sleep", "infinity"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  reviewer:
    image: busybox:1.37.0
    command: ["sleep", "infinity"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

volumes:
  pgdata:
