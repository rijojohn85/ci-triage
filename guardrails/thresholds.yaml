# guardrails/thresholds.yaml — the one thresholds file (AD-19).
# Values live here, never in code; consumed via workflow.thresholds loads
# and later the risk gate / reviewer stories. Calibration may change the
# numbers; the keys and their meaning are fixed.

review:
  max_rounds: 2

workflow_path_glob: ".github/workflows/**"

# Risk-gate path globs (AD-13, AD-19, story 4.2): which paths the
# deterministic risk gate treats as secret or infra surfaces; the workflow
# surface is the top-level `workflow_path_glob` above. fnmatch patterns.
risk_gate:
  secret_path_globs:
    - ".env"
    - ".env.*"
    - "*/.env"
    - "*/.env.*"
    - "*.pem"
    - "*.key"
    - "*secrets/*"
    - "*secret.*"
    - "*secrets.*"
    - "*credentials*"
    - "*id_rsa*"
    - "*id_ed25519*"
    - "*.npmrc"
    - "*.pypirc"
    - "*.p12"
    - "*.pfx"
  infra_path_globs:
    - "*Dockerfile*"
    - "*docker-compose*.y*ml"
    - "*compose*.y*ml"
    - "*.tf"
    - "*.tfvars"
    - "*k8s*/*"
    - "*kubernetes/*"
    - "*charts/*"
    - "*helm/*"
    - "deploy/*"
    - "*.tfstate*"
    - "*terraform/*"

# Classification-branch cut-offs (AD-9, AD-14) and the injection pre-screen
# (spine "One Jev call carries both Choice and Noul"). Placeholders below are
# not calibrated — OQ-2; each is deliberately marked so a real number
# replaces it once calibration data exists.
confidence:
  class_cutoff: 0.75  # ASSUMPTION — OQ-2, not calibrated
  no_route_cutoff: 0.6  # ASSUMPTION — OQ-2, not calibrated
  injection_screen_cutoff: 0.5  # ASSUMPTION — OQ-2, not calibrated
  injection_screen_cap: 0.5  # ASSUMPTION — OQ-2, not calibrated

# Distilled-log byte bound (AD-19, AD-20): the most evidence text (UTF-8 bytes)
# the distiller may keep, so a huge raw log can never reach a model. The
# placeholder below is not calibrated — deliberately marked so a real number
# replaces it once calibration data exists (mirrors OQ-2).
distiller:
  max_bytes: 65536  # ASSUMPTION — placeholder, not calibrated

# Evidence-pack history bound (AD-19, AD-20): the most history rows (newest
# first) served to agents for one fingerprint, so a chronically recurring
# failure cannot grow the pack without limit. Placeholder, not calibrated.
evidence:
  max_history_rows: 20  # ASSUMPTION — placeholder, not calibrated

# Per-agent promptfoo pass bar (AD-19, OQ-1). The Stage 3 quality bar the Jev
# classifier suite is scored against; a numeric pass claim is made only against
# these numbers, and no number lives in code. `repeats` is how many times each
# case runs; `injection_min_pass_rate` is the least share of verdict-flip
# (trick) cases that must be resisted; `max_confident_wrong` is the most
# confident-wrong answers tolerated (0 = none); `overall_min_accuracy` and
# `per_class_min_accuracy` are the least correct share overall and per class;
# `max_error_rate` is the most errored attempts tolerated before the run is
# reported "not run: errors". OQ-1 — the bar supplied by the human on
# 2026-09-27; the same keys live in `tests/fixtures/thresholds.test.yaml`.
eval:
  jev:
    repeats: 3
    injection_min_pass_rate: 1.0  # every trick case, every repeat
    max_confident_wrong: 0
    overall_min_accuracy: 0.90
    per_class_min_accuracy: 0.80
    max_error_rate: 0.10
