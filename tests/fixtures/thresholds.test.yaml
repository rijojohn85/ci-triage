# tests/fixtures/thresholds.test.yaml — fixture thresholds for tests, never
# the real `guardrails/thresholds.yaml` (spec-2.2 Boundaries & Constraints).
# Same shape as the real file; kept in sync deliberately, not generated.

review:
  max_rounds: 2

workflow_path_glob: ".github/workflows/**"

risk_gate:
  secret_path_globs:
    - ".env"
    - ".env.*"
    - "*/.env"
    - "*/.env.*"
    - "*.pem"
    - "*.key"
    - "*secrets/*"
    - "*secret.*"
    - "*secrets.*"
    - "*credentials*"
    - "*id_rsa*"
    - "*id_ed25519*"
    - "*.npmrc"
    - "*.pypirc"
    - "*.p12"
    - "*.pfx"
  infra_path_globs:
    - "*Dockerfile*"
    - "*docker-compose*.y*ml"
    - "*compose*.y*ml"
    - "*.tf"
    - "*.tfvars"
    - "*k8s*/*"
    - "*kubernetes/*"
    - "*charts/*"
    - "*helm/*"
    - "deploy/*"
    - "*.tfstate*"
    - "*terraform/*"

confidence:
  class_cutoff: 0.75
  no_route_cutoff: 0.6
  injection_screen_cutoff: 0.5
  injection_screen_cap: 0.5

distiller:
  max_bytes: 4096

evidence:
  max_history_rows: 5
